name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Models Directory
        run: mkdir -p assets/models
        
      # سيرفر GitHub يجلب النموذج ويدمجه داخل التطبيق
      - name: Download Model into App
        run: |
          curl -L -o assets/models/obad_model_q4.gguf "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Release APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: obad-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
